name: build-android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # ⚠ 不要用默认的 "tools platform-tools"：新版 runner 镜像里 `tools`
          #   这个包名已经不存在，sdkmanager 会以 `Failed to find package 'tools'`
          #   失败，而这一步失败会让整个 job 19 秒就红掉。
          #   platform-tools 是 adb 所在包，Gradle 构建其实不需要，但留着无妨。
          packages: "platform-tools"

      - name: 确保 platform 34 / build-tools 34 存在
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK 就绪：$(ls "$ANDROID_SDK_ROOT/platforms" | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: 构建
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LightPillar-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
